name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force deploy both backend and frontend'
        type: boolean
        default: false

# One deploy at a time, queued rather than cancelled. Two pushes to main used
# to run two deploys against the same host: their `docker-compose up` calls
# interleaved, and whichever finished last decided what production ran —
# regardless of which commit was newer. Cancelling instead of queueing would be
# worse still, since a cancel can land mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_NAME: inite-billing-service
  DOMAIN: billing.inite.ai

jobs:
  # ── Tests (required) ───────────────────────────────────────
  tests:
    uses: ./.github/workflows/ci.yml

  # ── Detect what changed ────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          backend:
            - 'src/**'
            - 'prisma/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'nest-cli.json'
            - 'Dockerfile'
          frontend:
            - 'frontend/**'
          infra:
            - '.github/workflows/deploy.yml'

  # ── Build backend ──────────────────────────────────────────
  build-backend:
    needs: [tests, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:buildcache,mode=max
        platforms: linux/amd64

  # ── Build frontend ─────────────────────────────────────────
  build-frontend:
    needs: [tests, changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=https://${{ env.DOMAIN }}
          NEXT_PUBLIC_AUTH_SERVICE_URL=https://auth.inite.ai
          NEXT_PUBLIC_OAUTH_CLIENT_ID=inite-billing
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:buildcache,mode=max
        platforms: linux/amd64

  # ── Deploy backend (incremental fast-path) ─────────────────
  # Only for code-only changes where the stack already exists on the host.
  # When infra changed (or force_all), deploy-infra does a full up -d of both
  # services, so this job is skipped to avoid racing it (on a first deploy the
  # compose file does not exist yet — that is deploy-infra's job to create).
  deploy-backend:
    needs: [build-backend, changes]
    if: |
      needs.changes.outputs.backend == 'true'
      && needs.changes.outputs.infra != 'true'
      && github.event.inputs.force_all != 'true'
    runs-on: [self-hosted, sfo]
    steps:
    - name: Confirm this runner is the billing origin host
      run: |
        # `runs-on` pins this to the `sfo` runner, which is the box that serves
        # billing.inite.ai. This check stays as the backstop: the shared
        # Postgres container is the precondition every step below already
        # assumes (the migration baseline runs `docker exec postgres`), so if
        # the pin is ever loosened or the label lands on a second machine, the
        # job says so here instead of failing three steps later — or, as it did
        # on 2026-08-09, reporting success while production stayed on the old
        # image.
        if ! docker ps --format '{{.Names}}' | grep -qx 'postgres'; then
          echo "::error::Runner $(hostname) is not the billing origin: no 'postgres' container. Check that the 'sfo' label is on the billing origin runner only."
          exit 1
        fi
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Deploy backend
      run: |
        mkdir -p /opt/projects/${{ env.PROJECT_NAME }}
        cd /opt/projects/${{ env.PROJECT_NAME }}

        set_env() {
          key="$1"; value="$2"
          touch .env
          grep -v "^${key}=" .env > .env.next || true
          echo "${key}=${value}" >> .env.next
          mv .env.next .env
        }

        # Ensure .env exists
        if [ ! -f .env ]; then
          {
            echo "DATABASE_URL=postgresql://${{ secrets.ORCH_POSTGRES_USER }}:${{ secrets.ORCH_POSTGRES_PASSWORD }}@postgres:5432/inite_billing?schema=billing"
            echo "REDIS_URL=redis://redis:6379"
            echo "OAUTH_CLIENT_SECRET=${{ secrets.BILLING_OAUTH_CLIENT_SECRET }}"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
          } > .env
        fi

        # Ensure docker-compose.yml exists
        if [ ! -f docker-compose.yml ]; then
          echo "docker-compose.yml not found — run full deploy first"
          exit 1
        fi

        IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service"
        NEW_TAG="${{ github.sha }}"
        # What is running right now, so a failed deploy has something to go back
        # to. Empty on the first deploy after immutable tags landed.
        PREV_TAG="$(sed -n 's/^BILLING_API_TAG=//p' .env | tail -1)"

        # Deploy the commit, not `:latest`. A mutable tag meant a container
        # recreated for any reason later — a host reboot, an unrelated compose
        # command — silently picked up whatever `latest` pointed at by then, and
        # there was no way to name the version to go back to.
        docker pull "$IMAGE:$NEW_TAG"
        set_env BILLING_API_TAG "$NEW_TAG"
        docker-compose up -d --no-deps --force-recreate billing-service || echo "::warning::docker-compose up reported an error — the health gate below decides"

        # Poll the app's own readiness (database + redis) instead of the container
        # state: a
        # crash-looping container still reads as "Up" while it is mid-boot,
        # which is how a broken image shipped green on 2026-08-09.
        for i in $(seq 1 30); do
          if docker exec inite-billing-service wget --spider -q http://localhost:3000/health/ready 2>/dev/null; then
            echo "Backend deployed successfully (healthy after ${i} attempt(s))"
            exit 0
          fi
          sleep 5
        done

        echo "Backend deployment failed — /health never came up"
        docker-compose ps billing-service
        docker-compose logs --tail 100 billing-service

        # Put production back on the version that was serving. The job still
        # fails: the deploy did not succeed, and saying otherwise is how a
        # broken release goes unnoticed.
        if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
          echo "::warning::Rolling back billing-service to ${PREV_TAG}"
          set_env BILLING_API_TAG "$PREV_TAG"
          docker-compose up -d --no-deps --force-recreate billing-service
          for i in $(seq 1 24); do
            if docker exec inite-billing-service wget --spider -q http://localhost:3000/health/ready 2>/dev/null; then
              echo "Rolled back to ${PREV_TAG} and healthy"
              break
            fi
            sleep 5
          done
        else
          echo "::error::No previous tag recorded — production is left on the failed image"
        fi
        exit 1

  # ── Deploy frontend (incremental fast-path) ────────────────
  # Skipped when a full infra deploy runs — see deploy-backend for rationale.
  deploy-frontend:
    needs: [build-frontend, changes]
    if: |
      needs.changes.outputs.frontend == 'true'
      && needs.changes.outputs.infra != 'true'
      && github.event.inputs.force_all != 'true'
    runs-on: [self-hosted, sfo]
    steps:
    - name: Confirm this runner is the billing origin host
      run: |
        # `runs-on` pins this to the `sfo` runner, which is the box that serves
        # billing.inite.ai. This check stays as the backstop: the shared
        # Postgres container is the precondition every step below already
        # assumes (the migration baseline runs `docker exec postgres`), so if
        # the pin is ever loosened or the label lands on a second machine, the
        # job says so here instead of failing three steps later — or, as it did
        # on 2026-08-09, reporting success while production stayed on the old
        # image.
        if ! docker ps --format '{{.Names}}' | grep -qx 'postgres'; then
          echo "::error::Runner $(hostname) is not the billing origin: no 'postgres' container. Check that the 'sfo' label is on the billing origin runner only."
          exit 1
        fi
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Deploy frontend
      run: |
        mkdir -p /opt/projects/${{ env.PROJECT_NAME }}
        cd /opt/projects/${{ env.PROJECT_NAME }}

        if [ ! -f docker-compose.yml ]; then
          echo "docker-compose.yml not found — run full deploy first"
          exit 1
        fi

        set_env() {
          key="$1"; value="$2"
          touch .env
          grep -v "^${key}=" .env > .env.next || true
          echo "${key}=${value}" >> .env.next
          mv .env.next .env
        }

        IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend"
        NEW_TAG="${{ github.sha }}"
        PREV_TAG="$(sed -n 's/^BILLING_WEB_TAG=//p' .env | tail -1)"

        docker pull "$IMAGE:$NEW_TAG"
        set_env BILLING_WEB_TAG "$NEW_TAG"
        docker-compose up -d --no-deps --force-recreate billing-frontend || echo "::warning::docker-compose up reported an error — the health gate below decides"

        # Same reasoning as the backend gate: serve a real request, not a state string.
        for i in $(seq 1 24); do
          if docker exec inite-billing-frontend wget --spider -q http://localhost:3001/ 2>/dev/null; then
            echo "Frontend deployed successfully (healthy after ${i} attempt(s))"
            exit 0
          fi
          sleep 5
        done

        echo "Frontend deployment failed — the app never served a request"
        docker-compose ps billing-frontend
        docker-compose logs --tail 100 billing-frontend

        if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
          echo "::warning::Rolling back billing-frontend to ${PREV_TAG}"
          set_env BILLING_WEB_TAG "$PREV_TAG"
          docker-compose up -d --no-deps --force-recreate billing-frontend
          for i in $(seq 1 24); do
            if docker exec inite-billing-frontend wget --spider -q http://localhost:3001/ 2>/dev/null; then
              echo "Rolled back to ${PREV_TAG} and healthy"
              break
            fi
            sleep 5
          done
        else
          echo "::error::No previous tag recorded — production is left on the failed image"
        fi
        exit 1

  # ── Full infra deploy (docker-compose.yml + .env + both services) ──
  # Runs on infra changes and on the first deploy; also the force_all path.
  # Waits on both image builds (which always run when infra/force is set) so it
  # never pulls a stale :latest, and it recreates compose + brings up the stack.
  deploy-infra:
    needs: [tests, changes, build-backend, build-frontend]
    if: needs.changes.outputs.infra == 'true' || github.event.inputs.force_all == 'true'
    runs-on: [self-hosted, sfo]
    steps:
    - name: Confirm this runner is the billing origin host
      run: |
        # `runs-on` pins this to the `sfo` runner, which is the box that serves
        # billing.inite.ai. This check stays as the backstop: the shared
        # Postgres container is the precondition every step below already
        # assumes (the migration baseline runs `docker exec postgres`), so if
        # the pin is ever loosened or the label lands on a second machine, the
        # job says so here instead of failing three steps later — or, as it did
        # on 2026-08-09, reporting success while production stayed on the old
        # image.
        if ! docker ps --format '{{.Names}}' | grep -qx 'postgres'; then
          echo "::error::Runner $(hostname) is not the billing origin: no 'postgres' container. Check that the 'sfo' label is on the billing origin runner only."
          exit 1
        fi
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Deploy full stack
      run: |
        mkdir -p /opt/projects/${{ env.PROJECT_NAME }}
        cd /opt/projects/${{ env.PROJECT_NAME }}

        # Write the values this deploy owns, and keep everything else that is
        # already there. This used to be `> .env`, which meant a full deploy
        # silently deleted anything an operator had added — feature flags, mail
        # credentials, a temporary override — with no trace of what was lost.
        set_env() {
          local key="$1" value="$2"
          touch .env
          # `grep -v` then append, so the key keeps one definition and the rest
          # of the file keeps its order.
          grep -v "^${key}=" .env > .env.next || true
          echo "${key}=${value}" >> .env.next
          mv .env.next .env
        }

        set_env DATABASE_URL "postgresql://${{ secrets.ORCH_POSTGRES_USER }}:${{ secrets.ORCH_POSTGRES_PASSWORD }}@postgres:5432/inite_billing?schema=billing"
        set_env REDIS_URL "redis://redis:6379"
        set_env OAUTH_CLIENT_SECRET "${{ secrets.BILLING_OAUTH_CLIENT_SECRET }}"
        set_env ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
        set_env DOCKERHUB_USERNAME "${{ secrets.DOCKERHUB_USERNAME }}"

        # The versions this deploy is putting into service, and the ones it can
        # go back to. Compose reads both from .env, so what is running is
        # written down instead of being whatever `:latest` resolved to at the
        # moment a container happened to start.
        PREV_API_TAG="$(sed -n 's/^BILLING_API_TAG=//p' .env | tail -1)"
        PREV_WEB_TAG="$(sed -n 's/^BILLING_WEB_TAG=//p' .env | tail -1)"
        set_env BILLING_API_TAG "${{ github.sha }}"
        set_env BILLING_WEB_TAG "${{ github.sha }}"
        chmod 600 .env

        # Recreate docker-compose.yml
        cat > docker-compose.yml << COMPOSE_EOF
        services:
          billing-service:
            image: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:\${BILLING_API_TAG}
            container_name: inite-billing-service
            restart: unless-stopped
            labels:
              - "traefik.enable=true"
              - "traefik.docker.network=traefik-global"
              - "traefik.http.services.billing-api-service.loadbalancer.server.port=3000"
              - "traefik.http.routers.billing-api.rule=Host(\`${{ env.DOMAIN }}\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/health\`) || PathPrefix(\`/webhooks\`))"
              - "traefik.http.routers.billing-api.entrypoints=websecure"
              - "traefik.http.routers.billing-api.tls=true"
              - "traefik.http.routers.billing-api.tls.certresolver=letsencrypt"
              - "traefik.http.routers.billing-api.priority=100"
              - "traefik.http.routers.billing-api.service=billing-api-service"
            # Everything in .env reaches the app; the pinned values below still
            # win. Without this, a flag an operator sets in .env is read by
            # compose for substitution and then never passed to the container.
            env_file:
              - .env
            environment:
              - NODE_ENV=production
              - PORT=3000
              - FRONTEND_URL=https://${{ env.DOMAIN }}
              - DATABASE_URL=\${DATABASE_URL}
              - REDIS_URL=\${REDIS_URL}
              - AUTH_SERVICE_URL=https://auth.inite.ai
              # The `iss` inside the token, which is NOT the JWKS host: the
              # identity provider signs with auth-api. Unset, this service
              # accepts any token those keys can verify, whoever issued it.
              - JWT_ISSUER=https://auth-api.inite.ai
              - CORS_ORIGINS=https://${{ env.DOMAIN }}
              - ANTHROPIC_API_KEY=\${ANTHROPIC_API_KEY}
            networks:
              - traefik-global
            healthcheck:
              test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/ready"]
              interval: 30s
              timeout: 10s
              retries: 5
              start_period: 60s

          billing-frontend:
            image: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:\${BILLING_WEB_TAG}
            container_name: inite-billing-frontend
            restart: unless-stopped
            labels:
              - "traefik.enable=true"
              - "traefik.docker.network=traefik-global"
              - "traefik.http.routers.billing-frontend.rule=Host(\`${{ env.DOMAIN }}\`)"
              - "traefik.http.routers.billing-frontend.entrypoints=websecure"
              - "traefik.http.routers.billing-frontend.tls=true"
              - "traefik.http.routers.billing-frontend.tls.certresolver=letsencrypt"
              - "traefik.http.routers.billing-frontend.priority=10"
              - "traefik.http.services.billing-frontend.loadbalancer.server.port=3001"
              - "traefik.http.routers.billing-frontend-http.rule=Host(\`${{ env.DOMAIN }}\`)"
              - "traefik.http.routers.billing-frontend-http.entrypoints=web"
              - "traefik.http.routers.billing-frontend-http.middlewares=redirect-to-https"
              - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
              - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
            environment:
              - NODE_ENV=production
              - NEXT_PUBLIC_API_URL=https://${{ env.DOMAIN }}
              - NEXT_PUBLIC_AUTH_SERVICE_URL=https://auth.inite.ai
              - NEXT_PUBLIC_OAUTH_CLIENT_ID=inite-billing
              - OAUTH_CLIENT_SECRET=\${OAUTH_CLIENT_SECRET}
            networks:
              - traefik-global
            healthcheck:
              test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/"]
              interval: 30s
              timeout: 10s
              retries: 5
              start_period: 40s

        networks:
          traefik-global:
            external: true
        COMPOSE_EOF

        # No migration surgery here any more. This step used to delete every
        # `_prisma_migrations` row with `finished_at IS NULL` — the record that
        # a migration started and never finished — which tells the next boot to
        # run that migration again over a schema where some of its statements
        # already applied, and which also deletes the row of a migration another
        # container is running at that moment. `scripts/migrate.sh` now stops and
        # says what to resolve instead.

        docker pull "${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:${{ github.sha }}"
        docker pull "${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:${{ github.sha }}"

        docker-compose down --remove-orphans
        docker-compose up -d || echo "::warning::docker-compose up reported an error — the health gate below decides"

        # The old gate grepped `docker-compose ps` for "Up", which passed as
        # long as *any* container was running — a dead backend behind a live
        # frontend still reported a green deploy. Both services must now answer.
        backend_ok=""
        frontend_ok=""
        for i in $(seq 1 30); do
          if [ -z "$backend_ok" ] && docker exec inite-billing-service wget --spider -q http://localhost:3000/health/ready 2>/dev/null; then
            backend_ok=1
          fi
          if [ -z "$frontend_ok" ] && docker exec inite-billing-frontend wget --spider -q http://localhost:3001/ 2>/dev/null; then
            frontend_ok=1
          fi
          if [ -n "$backend_ok" ] && [ -n "$frontend_ok" ]; then
            echo "Full deploy successful (both services healthy after ${i} attempt(s))"
            exit 0
          fi
          sleep 5
        done

        echo "Deployment failed — backend_ok='${backend_ok:-no}' frontend_ok='${frontend_ok:-no}'"
        docker-compose ps
        docker-compose logs --tail 100

        # Return production to the versions that were serving before this run.
        # The job still fails — the deploy did not succeed — but the site is not
        # left down while someone reads the logs.
        if [ -n "$PREV_API_TAG" ] || [ -n "$PREV_WEB_TAG" ]; then
          echo "::warning::Rolling back to api=${PREV_API_TAG:-unchanged} web=${PREV_WEB_TAG:-unchanged}"
          if [ -n "$PREV_API_TAG" ]; then set_env BILLING_API_TAG "$PREV_API_TAG"; fi
          if [ -n "$PREV_WEB_TAG" ]; then set_env BILLING_WEB_TAG "$PREV_WEB_TAG"; fi
          docker-compose up -d || true
          for i in $(seq 1 24); do
            if docker exec inite-billing-service wget --spider -q http://localhost:3000/health/ready 2>/dev/null \
               && docker exec inite-billing-frontend wget --spider -q http://localhost:3001/ 2>/dev/null; then
              echo "Rolled back and healthy"
              break
            fi
            sleep 5
          done
        else
          echo "::error::No previous tags recorded — production is left on the failed images"
        fi
        exit 1

    - name: Cleanup
      if: always()
      run: docker system prune -f
