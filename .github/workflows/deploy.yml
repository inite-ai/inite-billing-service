name: Deploy INITE Billing Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_NAME: inite-billing-service
  DOMAIN: billing.inite.ai
  API_DOMAIN: billing-api.inite.ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:buildcache,mode=max
        platforms: linux/amd64

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=
          NEXT_PUBLIC_AUTH_SERVICE_URL=https://auth.inite.ai
          NEXT_PUBLIC_OAUTH_CLIENT_ID=inite-billing
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:buildcache,mode=max
        platforms: linux/amd64

    - name: Build info
      run: |
        echo "Docker images built and pushed successfully!"
        echo "Backend: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:latest"
        echo "Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:latest"
        echo "SHA: ${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Deploy to server
      run: |
        mkdir -p /opt/projects/${{ env.PROJECT_NAME }}
        cd /opt/projects/${{ env.PROJECT_NAME }}

        # Create .env — uses shared postgres + redis from inite-temporal stack
        {
          echo "DATABASE_URL=postgresql://${{ secrets.ORCH_POSTGRES_USER }}:${{ secrets.ORCH_POSTGRES_PASSWORD }}@postgres:5432/inite_billing?schema=billing"
          echo "REDIS_URL=redis://redis:6379"
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
          echo "JWT_PUBLIC_KEY=\"$(printf '%s' '${{ secrets.JWT_PUBLIC_KEY }}' | sed ':a;N;$!ba;s/\n/\\n/g')\""
          echo "OAUTH_CLIENT_SECRET=${{ secrets.BILLING_OAUTH_CLIENT_SECRET }}"
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
        } > .env

        # docker-compose — no local postgres/redis, uses shared infra via traefik-global
        cat > docker-compose.yml << COMPOSE_EOF
        services:
          billing-service:
            image: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:latest
            container_name: inite-billing-service
            restart: unless-stopped
            labels:
              - "traefik.enable=true"
              - "traefik.docker.network=traefik-global"
              - "traefik.http.routers.billing-api.rule=Host(\`billing-api.inite.ai\`)"
              - "traefik.http.routers.billing-api.entrypoints=websecure"
              - "traefik.http.routers.billing-api.tls=true"
              - "traefik.http.routers.billing-api.tls.certresolver=letsencrypt"
              - "traefik.http.routers.billing-api.service=billing-api-service"
              - "traefik.http.services.billing-api-service.loadbalancer.server.port=3000"
              - "traefik.http.routers.billing-api-path.rule=Host(\`billing.inite.ai\`) && (PathPrefix(\`/v1\`) || PathPrefix(\`/api\`) || PathPrefix(\`/health\`))"
              - "traefik.http.routers.billing-api-path.entrypoints=websecure"
              - "traefik.http.routers.billing-api-path.tls=true"
              - "traefik.http.routers.billing-api-path.tls.certresolver=letsencrypt"
              - "traefik.http.routers.billing-api-path.priority=100"
              - "traefik.http.routers.billing-api-path.service=billing-api-service"
              - "traefik.http.routers.billing-api-http.rule=Host(\`billing-api.inite.ai\`)"
              - "traefik.http.routers.billing-api-http.entrypoints=web"
              - "traefik.http.routers.billing-api-http.middlewares=redirect-to-https"
            environment:
              - NODE_ENV=production
              - PORT=3000
              - FRONTEND_URL=https://billing.inite.ai
              - DATABASE_URL=\${DATABASE_URL}
              - REDIS_URL=\${REDIS_URL}
              - JWT_SECRET=\${JWT_SECRET}
              - JWT_PUBLIC_KEY=\${JWT_PUBLIC_KEY}
              - CORS_ORIGINS=https://billing.inite.ai,https://billing-api.inite.ai
            networks:
              - traefik-global
            healthcheck:
              test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api"]
              interval: 30s
              timeout: 10s
              retries: 5
              start_period: 60s

          billing-frontend:
            image: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:latest
            container_name: inite-billing-frontend
            restart: unless-stopped
            labels:
              - "traefik.enable=true"
              - "traefik.docker.network=traefik-global"
              - "traefik.http.routers.billing-frontend.rule=Host(\`billing.inite.ai\`)"
              - "traefik.http.routers.billing-frontend.entrypoints=websecure"
              - "traefik.http.routers.billing-frontend.tls=true"
              - "traefik.http.routers.billing-frontend.tls.certresolver=letsencrypt"
              - "traefik.http.routers.billing-frontend.priority=10"
              - "traefik.http.services.billing-frontend.loadbalancer.server.port=3001"
              - "traefik.http.routers.billing-frontend-http.rule=Host(\`billing.inite.ai\`)"
              - "traefik.http.routers.billing-frontend-http.entrypoints=web"
              - "traefik.http.routers.billing-frontend-http.middlewares=redirect-to-https"
              - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
              - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
            environment:
              - NODE_ENV=production
              - NEXT_PUBLIC_API_URL=
              - NEXT_PUBLIC_AUTH_SERVICE_URL=https://auth.inite.ai
              - NEXT_PUBLIC_OAUTH_CLIENT_ID=inite-billing
              - OAUTH_CLIENT_SECRET=\${OAUTH_CLIENT_SECRET}
            networks:
              - traefik-global
            healthcheck:
              test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/"]
              interval: 30s
              timeout: 10s
              retries: 5
              start_period: 40s

        networks:
          traefik-global:
            external: true
        COMPOSE_EOF

        # Pull latest images
        echo "Pulling latest Docker images..."
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:latest
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-frontend:latest

        # Deploy
        echo "Deploying billing service..."
        docker-compose down --remove-orphans
        docker-compose up -d

        # Wait for services
        sleep 30

        # Verify
        if docker-compose ps | grep -q "Up"; then
          echo "Deployment successful!"
          echo "Frontend: https://${{ env.DOMAIN }}"
          echo "API: https://${{ env.API_DOMAIN }}"
        else
          echo "Deployment failed!"
          docker-compose logs
          exit 1
        fi

    - name: Cleanup
      if: always()
      run: |
        docker system prune -f

    - name: Notify
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "INITE Billing Service deployed successfully!"
          echo "Frontend: https://${{ env.DOMAIN }}"
          echo "API: https://${{ env.API_DOMAIN }}"
          echo "Swagger: https://${{ env.API_DOMAIN }}/api"
        else
          echo "Deployment failed! Check the logs above."
        fi
