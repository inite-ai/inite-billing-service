name: Release image

# Build and push a versioned, multi-arch Docker image — :vX.Y.Z and :X.Y,
# each a manifest list covering linux/amd64 AND linux/arm64 — so releases map
# to immutable images instead of only :latest from the rolling main deploy,
# and the same tag runs on x86 hosts and on ARM ones (Oracle Ampere,
# Graviton, Apple Silicon) without anyone choosing a variant.
#
# Triggers:
#   * workflow_call  — invoked by release-please.yml when it cuts a release
#     (the tag it pushes uses GITHUB_TOKEN, which by design cannot trigger a
#     `push: tags` workflow, so this is the path that actually fires).
#   * workflow_dispatch — build a specific tag on demand.
#   * push: tags — still fires if a human (non-GITHUB_TOKEN) pushes a v* tag.
#   * pull_request — only when something that shapes the image changes. It
#     builds and smoke-tests BOTH architectures and publishes nothing, so a
#     change that breaks the arm64 image is found on its PR, not on the next
#     release.
#
# How the two architectures are built — native runners, not emulation:
# each platform builds on a runner of its own architecture
# (ubuntu-24.04 / ubuntu-24.04-arm), pushes its image BY DIGEST only (no tag),
# and the `manifest` job stitches the digests into one manifest list under the
# release tags with `docker buildx imagetools create`. QEMU would let a single
# amd64 runner build both, but every arm64 instruction — `npm ci` and its
# Prisma post-installs, `nest build`, `prisma generate` — would run emulated,
# several times slower, and an emulated build does not prove the image starts
# on real arm64 hardware. Native runners keep the build as fast as today's,
# and the smoke test boots the image on the CPU it is for.
#
# Prisma: `prisma generate` runs inside each per-arch build, so `native`
# resolves to the right engine on each (linux-musl-openssl-3.0.x on amd64,
# linux-musl-arm64-openssl-3.0.x on arm64) and no extra binaryTargets are
# needed — adding the other arch's target would only ship a dead engine in
# every image. The smoke test proves it: the container runs
# `prisma migrate deploy` (schema engine) and /health/ready queries the
# database (query engine).
on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.5.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.5.0)'
        required: true
        type: string
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/schema.prisma'
      - 'scripts/migrate.sh'
      - '.github/workflows/release-image.yml'

permissions:
  contents: read

env:
  # Publishing happens on every trigger except a pull request. (Under
  # workflow_call the event is the caller's — release-please's push.)
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.platform }})
    strategy:
      # One architecture failing must stop the release: a manifest list
      # missing arm64 would be published under a tag that claims both.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag ref when invoked by release-please / dispatch; the pushed
          # tag (or the PR merge ref) otherwise.
          ref: ${{ inputs.tag || github.ref }}
      - id: pair
        run: |
          P="${{ matrix.platform }}"
          echo "pair=${P//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Labels only — the tags are applied once, to the manifest list.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: inite-billing-service

      # Build for this runner's own platform and load it into the local
      # daemon, so the smoke test below runs the very build that is pushed.
      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: inite-billing-service:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ steps.pair.outputs.pair }}
          cache-to: type=gha,scope=release-${{ steps.pair.outputs.pair }},mode=max

      # Boot the image against real Postgres (pgvector, which the migrations
      # need) and Redis — both multi-arch images, so on the arm64 runner the
      # whole stack is arm64. Migrations run in the container's own entrypoint;
      # /health/ready answers only once the database and Redis are reachable
      # through the Prisma client.
      - name: Smoke run (${{ matrix.platform }})
        run: |
          set -euo pipefail
          docker image inspect inite-billing-service:smoke --format 'image platform: {{.Os}}/{{.Architecture}}'
          docker network create billing-smoke
          docker run -d --name pg --network billing-smoke \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=inite_billing \
            pgvector/pgvector:pg15
          docker run -d --name redis --network billing-smoke redis:7-alpine
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name billing --network billing-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL='postgresql://postgres:postgres@pg:5432/inite_billing?schema=billing' \
            -e REDIS_URL=redis://redis:6379 \
            -e JWT_SECRET=ci-smoke-jwt-secret-not-a-real-one \
            -e JWT_ISSUER=https://issuer.invalid \
            -e AUTH_SERVICE_URL=https://auth.invalid \
            -e FRONTEND_URL=http://localhost:3001 \
            inite-billing-service:smoke
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:3000/health/ready >/dev/null; then
              echo "service healthy on $(docker exec billing uname -m)"
              curl -s http://localhost:3000/health; echo
              curl -s http://localhost:3000/health/ready; echo
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Status}}' billing)" != running ]; then
              echo "container exited"
              break
            fi
            sleep 2
          done
          echo "service did not become ready"
          docker logs billing
          exit 1

      # Same build again, this time pushed by digest with no tag. Every layer
      # is already in the builder from the step above, so this only uploads.
      - name: Push by digest (${{ matrix.platform }})
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ steps.pair.outputs.pair }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no digest from the push"; exit 1; }
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ steps.pair.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        # release-please cuts a COMPONENT-prefixed tag (inite-billing-service-vX.Y.Z),
        # but metadata-action's semver parser needs a bare vX.Y.Z — otherwise it
        # emits NO tags and there is nothing to publish the list under. Strip
        # the component prefix; a plain `v*` push tag passes through.
        run: |
          RAW="${{ inputs.tag || github.ref_name }}"
          echo "tag=${RAW#inite-billing-service-}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service
          # `value=` derives the version from the input tag when this runs off
          # a non-tag ref (workflow_call from the main-branch release run);
          # it falls back to the pushed tag name for the push trigger.
          #
          # Do NOT tag `:latest` here. `:latest` tracks the rolling main deploy
          # (deploy.yml build-backend pushes it), and prod's docker-compose pulls
          # `:latest`. A release is cut from a point-in-time tag that can be BEHIND
          # main, so tagging `:latest` from a release silently rolls prod's image
          # backwards. (This is exactly how v1.1.1 — cut before the prisma
          # migrations fix — clobbered `:latest` and crash-looped the backend.)
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.ver.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service
        run: |
          set -euo pipefail
          # Both architectures, or nothing: a list with one entry would be
          # published under a tag that promises two.
          N="$(find . -maxdepth 1 -type f | wc -l)"
          [ "$N" -eq 2 ] || { echo "expected 2 digests, got $N"; exit 1; }
          TAGS="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          [ -n "$TAGS" ] || { echo "metadata produced no tags"; exit 1; }
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)
      - name: Verify both platforms are in the list
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inite-billing-service:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"
          RAW="$(docker buildx imagetools inspect "$IMAGE" --raw)"
          for p in linux/amd64 linux/arm64; do
            jq -e --arg p "$p" '[.manifests[] | (.platform.os + "/" + .platform.architecture)] | index($p) != null' <<< "$RAW" >/dev/null \
              || { echo "manifest list is missing $p"; exit 1; }
          done
          echo "manifest list carries linux/amd64 and linux/arm64"
