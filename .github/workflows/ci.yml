name: CI

on:
  # Reusable: deploy.yml calls this as its required test gate.
  workflow_call:
  push:
    branches: [main, develop]
  # Every pull request, not only the ones targeting main. Stacked branches —
  # a review PR based on a design PR based on main — were opening, being
  # reviewed and merging without CI ever running on them; the suite first saw
  # that code as a push to main, which is after the decision, not before it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image: the embeddings migration needs the vector extension
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: inite_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build
        run: npx nest build

      - name: Create test schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inite_billing_test?schema=billing

      # With coverage, so the thresholds in package.json are enforced rather
      # than aspirational. The floors sit just under what is measured today and
      # are highest on the paths that move money — they ratchet, they do not
      # describe an ambition.
      - name: Run tests
        run: npm run test:ci -- --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inite_billing_test?schema=billing
          REDIS_URL: redis://localhost:6381
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      # The e2e config is a separate jest project that nothing used to run —
      # it rotted until all 7 suites failed to load. Gate on it here.
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inite_billing_test?schema=billing
          TEST_REDIS_URL: redis://localhost:6381
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inite_billing_test?schema=billing
          REDIS_URL: redis://localhost:6381
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      # `critical` let everything below it through, and both trees were sitting
      # on high-severity advisories nobody was being told about — including a
      # Next.js middleware bypass on the frontend. Both are at zero now, so the
      # gate can be where it belongs.
      - name: Security audit
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # The frontend had no lint step and no ESLint config: `next lint` was
      # removed in Next 16, so nothing had been linting this app at all.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The frontend had no tests at all — not a runner, not a config, not one
      # assertion — while it holds the OAuth callback, the admin tables and the
      # money figures an operator reads.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t inite-billing-service:ci .
