name: Dev container

# Codespaces and "Reopen in Container" are the one-click setup in AGENTS.md.
# Nothing else would notice that environment breaking, so build it here and
# prove it works: dependencies installed, both databases migrated, and a
# DB-backed suite passing inside it.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package-lock.json'
      - 'mcp/package-lock.json'
      - 'prisma/**'
      - 'env.example'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and smoke-test the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          # The runner's Compose builds through buildx bake, which now refuses to
          # read the Dockerfile the devcontainer CLI writes to /tmp unless that
          # read is granted — the build failed on exactly that. Plain builds.
          COMPOSE_BAKE: 'false'
          BUILDX_BAKE_ENTITLEMENTS_FS: '0'
        with:
          push: never
          runCmd: |
            npx prisma migrate status
            npx jest test/money.spec.ts test/key-seal.spec.ts --forceExit
